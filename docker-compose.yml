version: "3.9"

services:
  db:
    build:
      context: ./db
    container_name: profile-db
    environment:
      POSTGRES_USER: keyno63
      POSTGRES_DB: maigowebdb
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres_password

  backend:
    build:
      context: ./backend
    container_name: profile-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/maigowebdb
      DATABASE_USER: keyno63
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      PORT: "8080"
    ports:
      - "8080:8080"
    secrets:
      - postgres_password

  website:
    build:
      context: ./website
    container_name: profile-website
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8080
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  db_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password.txt}
